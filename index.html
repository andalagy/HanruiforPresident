<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#004789" />
    <meta name="description" content="The central portal of Supreme Leader Hanrui Chen. Destiny calculator, intelligence bulletins, historical archive, and honors." />
    <title>Supreme Leader Hanrui Chen — Central Portal</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23004789'/%3E%3Cpath d='M16 3L19 13L29 16L19 19L16 29L13 19L3 16L13 13Z' fill='%23ed1c27'/%3E%3C/svg%3E" />
    <style>
      html,body{margin:0;background:#e6edf5;color:#17365b}
      .startup-shell{max-width:900px;margin:48px auto;padding:32px 24px;background:white;border:1px solid #8b9eb5;border-top:8px solid #ae101a;text-align:center;font:16px/1.6 Georgia,serif}
      .startup-shell h1{font-size:clamp(26px,5vw,40px);color:#ae101a;margin:12px 0}.startup-shell p{margin:16px 0}.startup-shell a{color:#004789}.startup-shell button{background:#ae101a;color:#fff;border:1px solid #870711;padding:10px 24px;font:700 15px Georgia,serif;cursor:pointer}
      @media(max-width:600px){.startup-shell{margin:16px;padding:24px 16px}}
    </style>
  </head>
  <body>
    <!-- Kept visible until React mounts, including when an asset fails to load. -->
    <div id="root">
      <main class="startup-shell" id="startup-shell">
        <p>CENTRAL INFORMATION BUREAU</p>
        <h1>SUPREME LEADER HANRUI CHEN</h1>
        <p id="startup-status" role="status">Opening the Hanrui Chen central portal…</p>
        <button id="startup-retry" type="button" hidden onclick="location.reload()">Reload the portal</button>
        <noscript><p>JavaScript is required to operate the destiny calculator. Enable JavaScript and reload this page.</p></noscript>
      </main>
    </div>
    <script>
      (() => {
        function showRecovery() {
          const status = document.getElementById('startup-status');
          const retry = document.getElementById('startup-retry');
          if (!status || !retry) return;
          status.textContent = 'The interactive portal could not open. Reload the page to try again. If this continues, a new deployment may still be updating.';
          retry.hidden = false;
        }
        window.addEventListener('error', event => {
          if (event.target instanceof HTMLScriptElement) showRecovery();
        }, true);
        setTimeout(showRecovery, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
